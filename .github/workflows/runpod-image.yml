# Build the RunPod image (docker/Dockerfile) and push it to GHCR as
# ghcr.io/<owner>/ir_cube-runpod:<tag> and :<short sha>. Run by hand only
# (Actions tab, or `gh workflow run runpod-image.yml -f tag=...`).
name: runpod-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag, in addition to the short commit sha"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # the runner's default disk is too small for the image layers
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/ir_cube-runpod" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: NCPUS=4
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ inputs.tag }}
            ${{ steps.name.outputs.image }}:${{ steps.name.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
